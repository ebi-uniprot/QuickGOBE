spring.mvc.pathmatch.matching-strategy=ant_path_matcher
## ================= Profile ==============
spring.profiles.active=httpServer

## ================= Logging ==============
# set different package logging levels here
#logging.level.root=WARN
logging.level.uk.ac.ebi.quickgo.geneproduct=DEBUG

## ================= Tomcat ==============
server.tomcat.threads.max=0

## ================= zookeeper =================
zookeeper.hosts=wp-p2m-c8.ebi.ac.uk:2181

#The location and name of the file that contains regexes used to validate gene product ids on a database by database
#basis
geneproduct.db.xref.valid.regexes=
## =============== Validation  =================
geneproduct.db.xref.valid.casesensitive=false

# 1. Equivalent to .useDefaultResponseMessages(false)
# Disables automatic addition of generic error responses (e.g., from @ControllerAdvice) to all endpoints.
springdoc.override-with-generic-response=false

# 2. Equivalent to .apis(Predicates.not(RequestHandlerSelectors.basePackage("org.springframework.boot")))
# Explicitly excludes the org.springframework.boot package from documentation scanning.
springdoc.packages-to-exclude=org.springframework.boot

# 3. Equivalent to .paths(PathSelectors.any()) AND excluding /error
# By default, Springdoc scans all paths. To explicitly exclude the default /error path:
springdoc.paths-to-exclude=/error
